# ========== SPRING ==========
spring.config.import=optional:file:.env[.properties]
spring.application.name=ingenieriaSoftware2

# Mejor sacarlo cuando se resuelvan los ciclos entre beans
spring.main.allow-circular-references=true

# ========== SERVER ==========
server.port=${PORT:8086}

# ========== DATABASE (Supabase - proyecto "prueba") ==========
# Si da "Tenant or user not found", revisar el host en Supabase (Connect > JDBC > Session pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.yqwkiugnpgeigntkwipi.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# La password se define SOLO como variable de entorno o en el archivo .env, nunca en este archivo
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== HIKARICP POOL SETTINGS (SUPABASE POOLER / RENDER) ==========
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ========== JPA ==========
# validate: si una entidad no coincide con la base, la app no arranca y muestra que falla
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ========== SQL INIT ==========
# El esquema lo maneja Supabase, no un schema.sql
spring.sql.init.mode=never

# ========== ERROR HANDLING ==========
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=${ERROR_STACKTRACE:on_param}
server.error.include-exception=false

# ========== JWT ==========
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSeguraParaJWTConMasDe32Caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== LOGGING ==========
logging.level.com.ingenieriaSoftware2=DEBUG
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}