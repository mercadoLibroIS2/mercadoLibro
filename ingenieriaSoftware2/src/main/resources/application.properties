# ========== SPRING ==========
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:ingenieriaSoftware2/.env[.properties]
spring.application.name=ingenieriaSoftware2

# Mejor sacarlo cuando se resuelvan los ciclos entre beans
spring.main.allow-circular-references=true

# ========== SERVER ==========
server.port=${PORT:8086}

# ========== DATABASE ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mercadolibro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# ========== HIKARICP POOL SETTINGS (SUPABASE POOLER / RENDER) ==========
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ========== SQL INIT ==========
# El esquema lo maneja Supabase, no un schema.sql
spring.sql.init.mode=never

# ========== ERROR HANDLING ==========
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=${ERROR_STACKTRACE:on_param}
server.error.include-exception=false

# ========== JWT ==========
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSeguraParaJWTConMasDe32Caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== LOGGING ==========
logging.level.com.ingenieriaSoftware2=DEBUG
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ========== GOOGLE BOOKS API ==========
google.books.api.url=${GOOGLE_BOOKS_API_URL:https://www.googleapis.com/books/v1}
google.books.api.key=${GOOGLE_BOOKS_API_KEY:AIzaSyCVzUDKyyxw_QRFShH6BEuEuhL9LHh4NDI}
