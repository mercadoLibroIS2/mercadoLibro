$kind: http-request
url: "{{baseUrl}}/api/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{testUsername}}_duplicado",
      "email": "{{testEmail}}",
      "contrasenia": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El email duplicado se rechaza con HTTP 409', function () { pm.response.to.have.status(409); });
      pm.test('La respuesta identifica el conflicto de usuario', function () { pm.expect(pm.response.json().error).to.eql('UsuarioYaExiste'); });
    language: text/javascript
order: 4000
