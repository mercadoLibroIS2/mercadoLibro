$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombreOEmail": "{{testUsername}}",
      "contrasenia": "Incorrecta2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Credenciales incorrectas responden HTTP 401', function () { pm.response.to.have.status(401); });
      pm.test('La respuesta no entrega un token', function () { pm.expect(pm.response.text()).not.to.include('"token"'); });
    language: text/javascript
order: 7000
